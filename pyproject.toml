[project]
name = "digital-workshop"
version = "0.1.0"
description = "Briggs Digital Workshop - DXF asset productisation MVP"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "ezdxf>=1.3",
    "networkx>=3.2",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "isort>=5.13",
]

[tool.setuptools.packages.find]
include = ["digital_workshop*"]

[tool.setuptools.package-data]
digital_workshop = ["ui/static/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "D"]
ignore = ["D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
main_file = ""
addopts = "-p nicegui.testing.user_plugin --cov=digital_workshop --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["digital_workshop/__main__.py"]
